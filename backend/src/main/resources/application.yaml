server:
  port: 8080

spring:
  datasource:
    # Railway MySQL Database Configuration - Option 1: Individual variables
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    
    # Alternative Option 2: Full connection string (uncomment if Option 1 fails)
    # url: ${DATABASE_URL}
    # driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update  # Production ready - update schema without data loss
    show-sql: false  # Disable SQL logging
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
    open-in-view: false

# Data initialization disabled - database is now properly set up
spring.sql.init.mode: never
com.weroster.config.DataInitializer.enabled: true

# Logging configuration
logging:
  level:
    com.weroster: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Actuator configuration for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Application specific settings
app:
  data-initialization:
    enabled: false
