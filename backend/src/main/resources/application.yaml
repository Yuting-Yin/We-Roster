server:
  port: 8080

spring:
  datasource:
    # Railway MySQL Database Configuration
    url: jdbc:mysql://${{ MySQL.MYSQL_HOST }}:${{ MySQL.MYSQL_PORT }}/${{ MySQL.MYSQL_DATABASE }}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${{ MySQL.MYSQL_USER }}
    password: ${{ MySQL.MYSQL_PASSWORD }}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop  # Temporarily create tables for initial setup
    show-sql: false  # Disable SQL logging
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
    open-in-view: false

# Temporarily enable data initialization for initial setup
spring.sql.init.mode: never
com.weroster.config.DataInitializer.enabled: true

# Logging configuration
logging:
  level:
    com.weroster: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Application specific settings
app:
  data-initialization:
    enabled: false
