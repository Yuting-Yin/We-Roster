server:
  port: 8080

spring:
  datasource:
    # Railway MySQL Database Configuration
    url: jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQL_DATABASE}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQLUSER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # Don't auto-create tables in production
    show-sql: false  # Disable SQL logging
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
    open-in-view: false

# Disable data initialization for remote database
spring.sql.init.mode: never
com.weroster.config.DataInitializer.enabled: false

# Logging configuration
logging:
  level:
    com.weroster: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Application specific settings
app:
  data-initialization:
    enabled: false
