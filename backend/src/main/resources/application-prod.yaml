server:
  port: 8080

spring:
  datasource:
    # Remote database configuration
    # Replace these values with your actual remote database details
    url: jdbc:mysql://your-remote-host:3306/your-database?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: your-username
    password: your-password
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate  # Don't auto-create tables in production
    show-sql: false  # Disable SQL logging in production
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
    open-in-view: false

# Disable data initialization in production
spring.sql.init.mode: never

# Disable DataInitializer for production
com.weroster.config.DataInitializer.enabled: false

# Logging configuration
logging:
  level:
    com.weroster: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Application specific settings
app:
  data-initialization:
    enabled: false  # Disable data initialization for production
