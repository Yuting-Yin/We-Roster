server:
  port: 8080
spring:
  datasource:
    url: jdbc:mysql://localhost:3308/weroster?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: weroster
    password: weroster
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true
security:
  jwt:
    secret: "change-me-super-long-random-string-at-least-32-chars"
    issuer: "we-roster"
    access-token-minutes: 15
